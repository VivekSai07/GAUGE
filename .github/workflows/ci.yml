name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}
  schedule:
    # Weekly, independent of pushes -- catches dependency drift (e.g. a
    # mujoco/casadi release breaking something) between commits.
    - cron: "0 6 * * 1"

# Cancel a still-running CI job for the same branch/PR when a new commit
# lands, instead of burning minutes on a run that's already obsolete.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true

      - name: Install Python
        run: uv python install

      - name: Check uv.lock is in sync with pyproject.toml
        run: uv lock --check

      - name: Install dependencies
        run: uv sync --locked

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    env:
      # mujoco.Renderer (used by tests exercising get_rgbd()) needs a GL
      # backend that works without a display; osmesa is pure software
      # rendering and needs no GPU/driver, just libosmesa6-dev below.
      MUJOCO_GL: osmesa
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        # Submodule intentionally NOT checked out here -- see the sparse
        # checkout step below.

      - name: Get pinned menagerie submodule commit
        id: submodule-sha
        run: |
          SUBMODULE_SHA=$(git ls-tree HEAD -- sim/assets/menagerie | awk '{print $3}')
          echo "sha=$SUBMODULE_SHA" >> "$GITHUB_OUTPUT"

      - name: Cache menagerie submodule checkout
        id: cache-menagerie
        uses: actions/cache@v4
        with:
          path: sim/assets/menagerie
          key: menagerie-${{ steps.submodule-sha.outputs.sha }}

      - name: Sparse-checkout franka_emika_panda from the menagerie submodule
        if: steps.cache-menagerie.outputs.cache-hit != 'true'
        run: |
          set -e
          SUBMODULE_PATH=sim/assets/menagerie
          SUBMODULE_URL=$(git config -f .gitmodules --get submodule.$SUBMODULE_PATH.url)
          # The full mujoco_menagerie repo is ~1.8GB across ~70 robot dirs;
          # sim/conveyor_scene.py only ever loads franka_emika_panda/
          # (~36MB). A blobless + sparse clone fetches history/tree metadata
          # only, then checks out just that one directory at the exact
          # commit the superproject has pinned. Cached above by that pinned
          # SHA, so this only actually runs when the pin changes.
          git clone --filter=blob:none --no-checkout --sparse "$SUBMODULE_URL" "$SUBMODULE_PATH"
          cd "$SUBMODULE_PATH"
          git sparse-checkout set franka_emika_panda
          git checkout "${{ steps.submodule-sha.outputs.sha }}"

      - name: Install system libraries for headless MuJoCo rendering
        run: |
          sudo apt-get update
          # libgl1-mesa-glx was dropped from Ubuntu 24.04 (noble) and isn't
          # needed anyway: osmesa is pure software rendering, no GLX/display.
          sudo apt-get install -y libosmesa6-dev

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true

      - name: Install Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --locked --python ${{ matrix.python-version }}

      - name: Run tests with coverage
        run: uv run pytest -v --cov --cov-report=term-missing

      - name: CLI smoke test (run_conveyor_demo.py entry point)
        # Exercises the actual __main__ entry point (argv handling, config
        # loading from disk) in a way the pytest suite doesn't, since tests
        # call run_one_episode() directly rather than shelling out to this.
        # Only on the primary version -- redundant to repeat per matrix leg.
        if: matrix.python-version == '3.11'
        run: uv run python run_conveyor_demo.py
