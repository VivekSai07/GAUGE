name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # mujoco.Renderer (used by tests exercising get_rgbd()) needs a GL
      # backend that works without a display; osmesa is pure software
      # rendering and needs no GPU/driver, just libosmesa6-dev below.
      MUJOCO_GL: osmesa
    steps:
      - name: Checkout repository (with submodules)
        uses: actions/checkout@v4
        with:
          # sim/assets/menagerie is a git submodule providing the Panda XML
          # assets sim/conveyor_scene.py loads; without this the sim tests
          # fail with missing-file errors, not an obviously related message.
          submodules: true

      - name: Install system libraries for headless MuJoCo rendering
        run: |
          sudo apt-get update
          # libgl1-mesa-glx was dropped from Ubuntu 24.04 (noble) and isn't
          # needed anyway: osmesa is pure software rendering, no GLX/display.
          sudo apt-get install -y libosmesa6-dev

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true

      - name: Install Python
        run: uv python install

      - name: Install dependencies
        run: uv sync --locked

      - name: Run tests
        run: uv run pytest -v
