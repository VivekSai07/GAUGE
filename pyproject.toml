[project]
name = "gauge"
version = "0.1.0"
description = "MuJoCo-simulated Franka Panda that tracks and grasps a moving conveyor object via an eye-in-hand camera, Kalman filtering, and a kinematic MPC controller."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mujoco>=3.2.0",
    "casadi>=3.6.5",
    "numpy>=1.26",
    "pyyaml>=6.0",
    "defusedxml>=0.7.1",
    "opencv-python>=5.0.0.93",
    "ultralytics>=8.3.0",
    # torch is already a transitive dependency of ultralytics, but
    # [tool.uv.sources] below only overrides the source of *direct*
    # dependencies -- it has to be listed here for the Linux CPU-wheel
    # override to take effect at all.
    "torch",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.1",
]

[tool.uv.sources]
# On Linux, PyPI's default torch wheel is the CUDA build, which pulls in
# `triton`. Importing triton segfaults on GPU-less CI runners (observed:
# "Fatal Python error: Segmentation fault" inside triton/knobs.py during
# test collection, exit 139, on both the 3.11 and 3.12 matrix legs). CI
# has no GPU, so the CPU wheel is the correct build there and avoids
# triton entirely. Scoped to Linux so a developer machine with a real GPU
# (e.g. Windows + CUDA) still resolves the normal accelerated build --
# which experiments/yolo_precision/train.py needs for `device=0`.
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.coverage.run]
# Only our own pipeline code, not the vendored mujoco_menagerie submodule.
source = ["perception", "tracking", "prediction", "planning", "control", "manipulation", "sim"]
omit = ["sim/assets/*"]

[tool.ruff]
# Vendored submodule has its own ruff config and isn't our code to lint.
# docs/ has historical planning/spec docs with embedded code snippets that
# are a record of what was done at the time -- not live code to reformat.
extend-exclude = ["sim/assets/menagerie", "docs"]
