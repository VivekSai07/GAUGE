[project]
name = "gauge"
version = "0.1.0"
description = "MuJoCo-simulated Franka Panda that tracks and grasps a moving conveyor object via an eye-in-hand camera, Kalman filtering, and a kinematic MPC controller."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mujoco>=3.2.0",
    "casadi>=3.6.5",
    "numpy>=1.26",
    "pyyaml>=6.0",
    "defusedxml>=0.7.1",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
