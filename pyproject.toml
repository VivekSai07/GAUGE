[project]
name = "gauge"
version = "0.1.0"
description = "MuJoCo-simulated Franka Panda that tracks and grasps a moving conveyor object via an eye-in-hand camera, Kalman filtering, and a kinematic MPC controller."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mujoco>=3.2.0",
    "casadi>=3.6.5",
    "numpy>=1.26",
    "pyyaml>=6.0",
    "defusedxml>=0.7.1",
    "opencv-python>=5.0.0.93",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.1",
]
yolo-precision = [
    "ultralytics>=8.3.0",
    # torch/torchvision are already transitive deps of ultralytics, but
    # [tool.uv.sources] below only overrides the source of *direct*
    # dependencies -- listing them explicitly here is required for the
    # CUDA-index override to actually take effect (verified: without these
    # two lines, `uv lock -v` shows torch/torchvision resolved straight off
    # pypi.org regardless of the sources table, since ultralytics pulls
    # them in transitively).
    "torch",
    "torchvision",
]

[tool.uv.sources]
# PyPI's default torch/torchvision wheels are CPU-only; pull CUDA-enabled
# builds from PyTorch's own index instead so the yolo-precision group's GPU
# training actually uses the GPU (cu130 matches this machine's driver-
# reported CUDA 13.2 and has win_amd64 wheels for the resolved torch/
# torchvision versions).
torch = { index = "pytorch-cu130" }
torchvision = { index = "pytorch-cu130" }

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.coverage.run]
# Only our own pipeline code, not the vendored mujoco_menagerie submodule.
source = ["perception", "tracking", "prediction", "planning", "control", "manipulation", "sim"]
omit = ["sim/assets/*"]

[tool.ruff]
# Vendored submodule has its own ruff config and isn't our code to lint.
# docs/ has historical planning/spec docs with embedded code snippets that
# are a record of what was done at the time -- not live code to reformat.
extend-exclude = ["sim/assets/menagerie", "docs"]
